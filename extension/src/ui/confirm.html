<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Allow capture? · Pixel Perfect</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        padding: 18px;
      }
      .sites {
        display: grid;
        gap: 6px;
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../../icons/icon-32.png" alt="" />
      <h1>Allow this capture?</h1>
    </div>
    <div class="card sites">
      <div>
        <span class="muted">Pixel Perfect at</span>
        <span class="host" id="app"></span>
      </div>
      <div>
        <span class="muted">wants to capture</span>
        <span class="host" id="target"></span>
      </div>
    </div>
    <p class="muted">
      The page opens in a small window with your own session (your logins and
      cookie choices) and is screenshotted at each viewport. Nothing leaves your
      browser except the screenshots, which go to that Pixel Perfect tab.
    </p>
    <label class="row">
      <input type="checkbox" id="remember" checked />
      Remember this site for this app
    </label>
    <div class="actions">
      <button id="cancel">Cancel</button>
      <button id="allow" class="primary">Allow</button>
    </div>
    <script src="confirm.js" type="module"></script>
  </body>
</html>
