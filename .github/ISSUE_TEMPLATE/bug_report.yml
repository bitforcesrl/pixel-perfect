name: Bug report
description: Something in Pixel Perfect doesn't work as expected.
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search the existing issues first.
        **Security problems must not be reported here**: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project with a page pointing to https://example.com
        2. Press L to capture the mobile viewport
        3. ...
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running it?
      options:
        - Hosted version (e.g. Vercel)
        - Locally with npm run dev / npm start
        - Docker
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Comparison modes (Split / Overlay / Tap / Side by side)
        - Drag & drop
        - Figma export
        - Site capture (Playwright / Browserless)
        - Browser login
        - Projects, pages, ZIP import/export
        - Annotations, guides, notes
        - Other
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS and Node.js version.
      placeholder: Chrome 140, macOS 26, Node 26.13
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console or server output. Remove tokens and passwords first.
      render: text
