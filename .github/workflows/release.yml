# Publishes a GitHub Release whenever a version tag (v1.2.3, v0.3.0-beta.1…)
# is pushed. The release notes are the matching section of CHANGELOG.md, so
# the changelog stays the single source of truth for what a version contains.
name: Release

on:
  push:
    tags: ['v*.*.*']

# Two pushes of the same tag must never race to create the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed to create the release

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with package.json means the release commit is
      # incomplete: stop here rather than publish a mislabelled release.
      - name: Check tag matches package.json
        run: |
          version="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Everything between "## [<version>]" and the next "## [" heading (or
      # the link references at the bottom), with leading blank lines dropped.
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No section for $VERSION in CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      # Versions with a pre-release suffix (-beta.N, -rc.N…) are flagged as
      # pre-releases. Re-running the job updates the existing release instead
      # of failing on it.
      - name: Create or update the release
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md $prerelease
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $prerelease
          fi
